name: Build distributable installers

# Builds the license-gated YourDoc artifacts on real target hardware in GitHub's
# cloud, so no Mac and no local WSL/Docker are required:
#   * windows-latest -> dist/YourDoc-<ver>-Setup.exe      (Inno Setup, self-signed)
#   * ubuntu-latest  -> dist/YourDoc-<ver>.deb and .rpm   (real Linux kernel)
#   * macos-latest   -> dist/YourDoc-<ver>.dmg            (real Apple hardware)
# Download the results from the "Artifacts" list of each run. The build scripts
# are never shipped to customers -- they receive only the .exe/.deb/.rpm/.dmg.
#
# Each job installs the project into an isolated venv: the runner's system Python
# is "externally managed" (PEP 668) and refuses `pip install`, so a venv is the
# clean, reproducible way in.
#
# NOTE: macOS minutes are free only for PUBLIC repos; a private repo is billed at
# 10x weight. An unsigned .dmg will still trip Gatekeeper -- see MAC_LINUX_PLAN.md.

on:
  workflow_dispatch: {}          # run it by hand from the Actions tab
  push:
    tags: ["v*"]                 # or automatically on each version tag

jobs:
  windows:
    name: Windows (.exe Setup)
    runs-on: windows-latest
    # The signing material is a repository SECRET, never a committed file. When
    # they are absent the job still builds -- just unsigned, with a loud warning
    # from build_installer.py -- so an unsigned artifact can never pass for a
    # signed release unnoticed.
    env:
      SIGN_PFX_B64: ${{ secrets.YOURDOC_SIGN_PFX_B64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.YOURDOC_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Confirm the publisher key is embedded
        run: python -c "from src import license as l; assert not l.PUBLIC_KEY.startswith('PLACEHOLDER')"

      - name: Materialize the signing certificate (optional)
        if: env.SIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'yourdoc-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
          # Export just the PUBLIC certificate to ship beside the installer, so a
          # buyer can trust it once via trust-cert.ps1. The private key stays in
          # the .pfx on the ephemeral runner and is gone when the job ends.
          $sec = ConvertTo-SecureString $env:SIGN_PFX_PASSWORD -AsPlainText -Force
          $cert = New-Object Security.Cryptography.X509Certificates.X509Certificate2($pfx, $sec)
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          [IO.File]::WriteAllBytes("dist\Pryonx.cer", $cert.Export('Cert'))
          "YOURDOC_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "YOURDOC_SIGN_PFX_PASSWORD=$env:SIGN_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Freeze + build the installer (signed when a cert is configured)
        run: python build_installer.py --clean

      - uses: actions/upload-artifact@v4
        with:
          name: YourDoc-windows
          path: |
            dist/*-Setup.exe
            dist/Pryonx.cer
            installer/trust-cert.ps1
            installer/TRUSTING.md

  linux:
    name: Linux (.deb + .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build + runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              python3 python3-venv python3-dev python3-tk \
              ruby ruby-dev build-essential libffi-dev
          sudo gem install fpm

      - name: Create venv and install project + PyInstaller
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Confirm the publisher key is embedded
        run: |
          .venv/bin/python - <<'PY'
          from src import license as l
          assert not l.PUBLIC_KEY.startswith("PLACEHOLDER"), "no publisher key!"
          print("embedded key:", l.PUBLIC_KEY[:8], "...")
          PY

      - name: Build .deb and .rpm into dist/
        run: .venv/bin/python build_linux_package.py

      - uses: actions/upload-artifact@v4
        with:
          name: YourDoc-linux
          path: |
            dist/*.deb
            dist/*.rpm

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Homebrew Python + its matching Tk; then a venv (system pip is PEP 668
      # externally-managed and would refuse the install).
      - name: Install build + runtime dependencies
        run: |
          brew install python@3.12 python-tk@3.12
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Confirm the publisher key is embedded
        run: .venv/bin/python -c "from src import license as l; assert not l.PUBLIC_KEY.startswith('PLACEHOLDER')"

      # Ad-hoc signed by default (no Apple account) so it launches on Apple
      # Silicon; add a Developer ID via vars.APPLE_SIGNING_IDENTITY to notarize.
      - name: Build the .app and .dmg into dist/
        run: |
          if [ -n "${{ vars.APPLE_SIGNING_IDENTITY }}" ]; then
            .venv/bin/python build_macos_package.py --sign "${{ vars.APPLE_SIGNING_IDENTITY }}" --notarize
          else
            .venv/bin/python build_macos_package.py
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: YourDoc-macos
          path: dist/*.dmg
