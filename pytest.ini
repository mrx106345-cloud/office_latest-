[pytest]
minversion = 7.0
testpaths = tests
norecursedirs = tests/support build dist .hypothesis .git __pycache__
addopts = -ra --strict-markers --strict-config --timeout=900
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast, isolated tests of a single helper or function
    integration: several engine modules exercised together on real files
    security: encryption/offline/path-safety guarantees
    property: property-based and fuzz tests (opt in with --run-fuzz)
    ui: builds or drives the CustomTkinter GUI (needs a display)
    e2e: packaging / installed-artifact tests (opt in with --run-e2e)
    regression: locks down a specific bug fixed in development
    perf: scale / timing budgets on realistic inputs (opt in with --run-perf)
    slow: expected to take more than a few seconds
    requires_display: needs a working Tk display
    windows_only: only meaningful on Windows
filterwarnings =
    ignore::DeprecationWarning
